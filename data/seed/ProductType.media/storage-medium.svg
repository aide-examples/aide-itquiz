<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Storage medium">
  <!-- Storage medium — a generic pictogram, deliberately no brand mark: a product logo is a
       trademark and a hand-drawn imitation of one would be a false fact in a system
       whose first rule is that it stores none. -->
  <rect x="12" y="26" width="104" height="76" rx="8" fill="#ffffff" stroke="#4338ca" stroke-width="6"/>
  <circle cx="64" cy="64" r="28" fill="none" stroke="#4338ca" stroke-width="6"/>
  <circle cx="64" cy="64" r="8" fill="#4338ca"/>
  <path d="M64 36 a28 28 0 0 1 24 14" stroke="#c7d2fe" stroke-width="6" fill="none" stroke-linecap="round"/>
  <rect x="94" y="86" width="14" height="6" rx="3" fill="#c7d2fe"/>
</svg>
