  <rect x="50" y="50" width="28" height="28" rx="3" fill="#c7d2fe"/>
  <g stroke="#4338ca" stroke-width="6" stroke-linecap="round">
    <path d="M48 34 V16"/><path d="M64 34 V16"/><path d="M80 34 V16"/>
    <path d="M48 94 V112"/><path d="M64 94 V112"/><path d="M80 94 V112"/>
    <path d="M34 48 H16"/><path d="M34 64 H16"/><path d="M34 80 H16"/>
    <path d="M94 48 H112"/><path d="M94 64 H112"/><path d="M94 80 H112"/>
  </g>
</svg>
