  <path d="M48 106 H80 M64 94 V106" stroke="#4338ca" stroke-width="6" stroke-linecap="round"/>
  <circle cx="64" cy="56" r="17" fill="none" stroke="#4338ca" stroke-width="7"/>
  <g stroke="#4338ca" stroke-width="7" stroke-linecap="round">
    <path d="M64 30 V38"/><path d="M64 74 V82"/><path d="M38 56 H46"/><path d="M82 56 H90"/>
    <path d="M46 38 L52 44"/><path d="M76 68 L82 74"/><path d="M82 38 L76 44"/><path d="M52 68 L46 74"/>
  </g>
</svg>
