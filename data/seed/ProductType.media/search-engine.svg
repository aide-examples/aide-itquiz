  <rect x="26" y="34" width="44" height="6" rx="3" fill="#c7d2fe"/>
  <rect x="26" y="48" width="44" height="6" rx="3" fill="#c7d2fe"/>
  <rect x="26" y="62" width="30" height="6" rx="3" fill="#c7d2fe"/>
  <circle cx="86" cy="80" r="24" fill="#ffffff" stroke="#4338ca" stroke-width="8"/>
  <path d="M103 97 L118 112" stroke="#4338ca" stroke-width="10" stroke-linecap="round"/>
</svg>
