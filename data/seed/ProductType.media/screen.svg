<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Screen">
  <!-- Screen — a generic pictogram, deliberately no brand mark: a product logo is a
       trademark and a hand-drawn imitation of one would be a false fact in a system
       whose first rule is that it stores none. -->
  <rect x="8" y="16" width="112" height="76" rx="8" fill="#ffffff" stroke="#4338ca" stroke-width="6"/>
  <rect x="22" y="30" width="84" height="48" rx="3" fill="#c7d2fe"/>
  <path d="M44 112 H84 M64 92 V112" stroke="#4338ca" stroke-width="7" stroke-linecap="round"/>
</svg>
