<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Battery">
  <!-- Battery — a generic pictogram, deliberately no brand mark: a product logo is a
       trademark and a hand-drawn imitation of one would be a false fact in a system
       whose first rule is that it stores none. -->
  <rect x="10" y="38" width="96" height="52" rx="9" fill="#ffffff" stroke="#4338ca" stroke-width="6"/>
  <rect x="110" y="54" width="10" height="20" rx="3" fill="#4338ca"/>
  <rect x="22" y="50" width="26" height="28" rx="3" fill="#c7d2fe"/>
  <rect x="54" y="50" width="26" height="28" rx="3" fill="#c7d2fe"/>
</svg>
