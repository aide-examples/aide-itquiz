  <path d="M48 30 V20 a6 6 0 0 1 6-6 h20 a6 6 0 0 1 6 6 v10" fill="none" stroke="#4338ca" stroke-width="6"/>
  <rect x="22" y="48" width="24" height="42" rx="3" fill="#c7d2fe"/>
  <rect x="52" y="48" width="24" height="42" rx="3" fill="#c7d2fe"/>
  <rect x="82" y="48" width="24" height="42" rx="3" fill="#c7d2fe"/>
</svg>
