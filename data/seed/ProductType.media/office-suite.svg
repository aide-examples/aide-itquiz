<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Office suite">
  <!-- Office suite — a generic pictogram, deliberately no brand mark: a product logo is a
       trademark and a hand-drawn imitation of one would be a false fact in a system
       whose first rule is that it stores none. -->
