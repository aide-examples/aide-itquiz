<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="itquiz">
  <!-- itquiz — three term chips, brought into order. The mark carries no letters
       on purpose: at 192px a word is a smudge, and the one thing the system does
       is put confusable terms in their place, which a shape can say.
       Indigo #4338ca is the theme colour; the pale tile background is the PWA
       background, so the mark holds on a light and a dark home screen alike. -->
  <rect width="512" height="512" rx="96" fill="#4338ca"/>

  <!-- the sorted chips: widths differ so the stack reads as ordered, not as a list -->
  <rect x="104" y="128" width="252" height="58" rx="29" fill="#eef2ff"/>
  <rect x="104" y="222" width="188" height="58" rx="29" fill="#c7d2fe"/>
  <rect x="104" y="316" width="304" height="58" rx="29" fill="#eef2ff" opacity="0.75"/>

  <!-- the one that has just been placed -->
  <circle cx="356" cy="251" r="44" fill="#22c55e"/>
  <path d="M336 251 L351 266 L378 237" fill="none" stroke="#ffffff" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
